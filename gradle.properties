# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# AGP 9 ships a built-in Kotlin compiler and a new DSL. Opting out keeps the
# conventional kotlin-android plugin and DSL that every tutorial still shows; the
# migration is a deliberate later step (docs/DECISIONS.md).
android.builtInKotlin=false
android.newDsl=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
