# Every push and pull request: the same checks a developer runs before committing.
# On-device tests (Room SQL, the database migration, the Keystore) are not run here: an emulator on
# a hosted runner is slow and flaky. Run them locally with ./gradlew :app:connectedDebugAndroidTest.
name: Android

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle's downloads and build cache between runs, and validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Crypto module tests (libsodium on the JVM, interop fixtures from libsodium.js)
        run: ./gradlew :crypto:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      # The shrunk build: proves R8 and the keep rules still produce an app, and gives testers an APK.
      - name: Internal build (shrunk like release)
        run: ./gradlew :app:assembleInternal

      - uses: actions/upload-artifact@v4
        with:
          name: abcmailbox-internal-apk
          path: app/build/outputs/apk/internal/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports
            crypto/build/reports
          retention-days: 7
